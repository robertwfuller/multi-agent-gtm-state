CREATE EXTENSION IF NOT EXISTS "pgcrypto";

CREATE TABLE agent_jobs (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  entity_key TEXT NOT NULL, -- hash of external lead id, never raw email
  state TEXT NOT NULL CHECK (state IN (
    'INTAKE','ENRICHMENT','QUALIFICATION','OUTREACH','SYNC','RETRY_QUEUE','FAILED'
  )),
  locked_by TEXT, -- agent_id or worker hostname
  idempotency_key TEXT UNIQUE NOT NULL, -- client-generated, dedupes retries
  payload JSONB NOT NULL DEFAULT '{}'::jsonb, -- generic only, validated by jsonschema
  attempt INT NOT NULL DEFAULT 0,
  created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
  updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
);

CREATE INDEX ON agent_jobs (entity_key, state);
CREATE INDEX ON agent_jobs (idempotency_key);

-- Event sourcing (append-only)
CREATE TABLE agent_jobs_events (
  id BIGSERIAL PRIMARY KEY,
  job_id UUID REFERENCES agent_jobs(id),
  entity_key TEXT NOT NULL,
  from_state TEXT,
  to_state TEXT NOT NULL,
  locked_by TEXT,
  meta JSONB DEFAULT '{}',
  created_at TIMESTAMPTZ NOT NULL DEFAULT now()
);`}),p(Fn,{lang:"python",title:"locks/pg_advisory.py",code:`import hashlib
from sqlalchemy import text

def advisory_lock_key(entity_key: str) -> int:
    # stable 64-bit int from entity_key, avoids collisions
    return int(hashlib.sha256(entity_key.encode()).hexdigest()[:15], 16)

def transition_with_lock(conn, entity_key: str, idempotency_key: str, to_state: str):
    key = advisory_lock_key(entity_key)
    # xact-scoped: auto-released on COMMIT/ROLLBACK, no orphan locks
    locked = conn.execute(
        text("SELECT pg_try_advisory_xact_lock(:k)"),
        {"k": key}
    ).scalar()
    if not locked:
        raise ContentionError(f"entity {entity_key} locked")

    # idempotency check - insert first, fail fast on UNIQUE
    conn.execute(text("""
        INSERT INTO agent_jobs (entity_key, state, idempotency_key, payload)
        VALUES (:ek, :st, :ik, '{}'::jsonb)
        ON CONFLICT (idempotency_key) DO NOTHING
        RETURNING id
    """), {"ek": entity_key, "st": to_state, "ik": idempotency_key})
    
    # append event (projection reads this)
    conn.execute(text("""
        INSERT INTO agent_jobs_events (entity_key, from_state, to_state, locked_by)
        VALUES (:ek, :from, :to, :by)
    """), {"ek": entity_key, "from": "OUTREACH", "to": to_state, "by": "worker-1"})
`})]}),p(xe,{id:"structure",num:"06",title:"Project Structure",children:p(Fn,{lang:"text",title:"tree",code:`multi-agent-gtm-state-engine/
